:root {
  /* Világos alap — hűvös-semleges papír, hogy a piros kiüssön rajta */
  --papir:      #F1F3F6;
  --lap:        #FFFFFF;
  --tinta:      #171A20;
  --halvany:    #5C6472;
  --vonal:      #D7DBE2;
  --vonal-eros: #B6BDC8;

  /* Az app SAJÁT színei — nem díszítés, hanem idézet */
  --piros:      #C62828;
  --piros-sotet:#8E1B1B;
  --kek:        #12539E;
  --zold:       #2E7D32;
  --sarga-lap:  #FFF8E6;

  --alap: 17px;          /* az A− / A / A+ ezt állítja */
  --sav: 68ch;
  --sugar: 14px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papir:      #12151B;
    --lap:        #191D25;
    --tinta:      #E8EBF0;
    --halvany:    #99A2B0;
    --vonal:      #2B313C;
    --vonal-eros: #3C4451;
    --piros:      #EF5350;
    --piros-sotet:#B71C1C;
    --kek:        #6BA6E8;
    --zold:       #66BB6A;
    --sarga-lap:  #2A2417;
  }
}

:root[data-theme="dark"] {
  --papir:      #12151B;
  --lap:        #191D25;
  --tinta:      #E8EBF0;
  --halvany:    #99A2B0;
  --vonal:      #2B313C;
  --vonal-eros: #3C4451;
  --piros:      #EF5350;
  --piros-sotet:#B71C1C;
  --kek:        #6BA6E8;
  --zold:       #66BB6A;
  --sarga-lap:  #2A2417;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--papir);
  color: var(--tinta);
  font-family: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--alap);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .cimke, .gomb-szoveg {
  font-family: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

h1, h2, h3 { text-wrap: balance; margin: 0; }

h1 {
  font-size: clamp(2.1rem, 5.4vw, 3.15rem);
  font-weight: 700;
  letter-spacing: -0.028em;
  line-height: 1.08;
}

h2 {
  font-size: clamp(1.5rem, 3.2vw, 1.95rem);
  font-weight: 700;
  letter-spacing: -0.021em;
  line-height: 1.16;
}

h3 {
  font-size: 1.12rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

p { margin: 0; }
strong { font-weight: 600; }

.cimke {
  font-size: 0.775rem;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--halvany);
}

/* ── Váz ────────────────────────────────────────────────────────── */

.burok { max-width: 1080px; margin: 0 auto; padding: 0 22px; }
.hasab { max-width: var(--sav); }

section {
  padding: clamp(46px, 7vw, 80px) 0;
  border-top: 1px solid var(--vonal);
}
section:first-of-type { border-top: 0; }

.verem   { display: flex; flex-direction: column; gap: 20px; }
.verem-s { display: flex; flex-direction: column; gap: 12px; }

/* ── Fejléc ─────────────────────────────────────────────────────── */

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--papir) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--vonal);
}

.fejlec-sor {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 11px 0;
}

.marka {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: "Archivo", sans-serif;
  font-weight: 700;
  font-size: 1.06rem;
  letter-spacing: -0.02em;
}

.marka-jel {
  width: 26px; height: 26px;
  border-radius: 7px;
  background: var(--piros);
  display: grid; place-items: center;
  flex: none;
}
.marka-jel svg { width: 15px; height: 15px; }

.vezerlok { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.nyelvek, .meret {
  display: flex;
  border: 1px solid var(--vonal-eros);
  border-radius: 9px;
  overflow: hidden;
  background: var(--lap);
}

.nyelvek button, .meret button {
  font: inherit;
  font-size: 0.845rem;
  font-weight: 500;
  padding: 5px 11px;
  border: 0;
  background: transparent;
  color: var(--halvany);
  cursor: pointer;
  border-right: 1px solid var(--vonal);
}

.nyelvek button {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
}

/* A zászlók: megrajzolva, hogy minden gépen egyformák legyenek.
   ⚠ A vékony keret kell: a magyar és a német zászló FEHÉR sávja
   különben eltűnne a világos háttéren. */
.zaszlo {
  width: 21px;
  height: 14px;
  flex: none;
  border-radius: 2.5px;
  outline: 1px solid color-mix(in srgb, var(--tinta) 22%, transparent);
  outline-offset: -1px;
  /* A ki nem választott nyelv zászlaja halkabb — a kiválasztott üt ki. */
  opacity: 0.55;
  transition: opacity 0.15s ease;
}
/* ⚠ A kiválasztottat KIHAGYJUK: különben rávitt egérrel
   HALVÁNYABB lett, mint anélkül — visszafelé működött. */
.nyelvek button:not([aria-pressed="true"]):hover .zaszlo { opacity: 0.85; }
.nyelvek button[aria-pressed="true"] .zaszlo { opacity: 1; }
.nyelvek button:last-child, .meret button:last-child { border-right: 0; }
.nyelvek button:hover, .meret button:hover { color: var(--tinta); }

/* A kiválasztott nyelvet NEM csak szín jelöli: aláhúzás + félkövér is. */
.nyelvek button[aria-pressed="true"] {
  color: var(--tinta);
  font-weight: 600;
  box-shadow: inset 0 -3px 0 var(--piros);
}
.meret button[aria-pressed="true"] {
  color: var(--tinta);
  font-weight: 600;
  background: color-mix(in srgb, var(--tinta) 8%, transparent);
}

button:focus-visible, a:focus-visible {
  outline: 3px solid var(--kek);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ── Hős ────────────────────────────────────────────────────────── */

.hos {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  gap: clamp(32px, 5vw, 64px);
  align-items: center;
  padding-top: clamp(40px, 6vw, 68px);
}
@media (max-width: 860px) {
  .hos { grid-template-columns: 1fr; }
}

.bevezeto { font-size: 1.115rem; color: var(--halvany); }

.alairas {
  font-size: 0.94rem;
  color: var(--halvany);
  border-left: 3px solid var(--piros);
  padding-left: 14px;
}

/* A piros gomb — valódi méretben, ahogy a telefonon látszik */
.piros-gomb {
  background: var(--piros);
  color: #fff;
  border-radius: 18px;
  padding: 22px 20px;
  text-align: center;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--piros) 28%, transparent);
}
.piros-gomb .gomb-szoveg {
  font-size: clamp(1.4rem, 4.2vw, 1.85rem);
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.1;
  display: block;
}
.piros-gomb small {
  display: block;
  margin-top: 7px;
  font-size: 0.9rem;
  font-weight: 600;
  opacity: 0.94;
}

/* ── A telefon-makett ───────────────────────────────────────────── */

.telefon {
  background: var(--lap);
  border: 1px solid var(--vonal-eros);
  border-radius: 26px;
  padding: 14px;
  max-width: 355px;
  margin: 0 auto;
  box-shadow: 0 18px 44px rgba(10, 14, 25, 0.13);
}

.telefon-fejlec {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 2px 4px 12px;
  font-size: 0.86rem;
  color: var(--halvany);
}
.telefon-fejlec .marka-jel { width: 21px; height: 21px; border-radius: 6px; }
.telefon-fejlec .marka-jel svg { width: 12px; height: 12px; }
.fogaskerek { margin-left: auto; opacity: 0.5; }

.csempek {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.csempe {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 13px;
  overflow: hidden;
  display: grid;
  place-items: center;
}
.csempe svg { width: 74%; height: 74%; }

.csempe-nev {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 7px 6px;
  text-align: center;
  font-family: "Archivo", sans-serif;
  font-weight: 700;
  font-size: 0.83rem;
  color: #fff;
  background: rgba(20, 22, 28, 0.55);
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.csempe.ures { background: #DFE2E7; }
.csempe.ures .csempe-nev { background: rgba(70, 76, 88, 0.62); }

.mini-piros {
  margin-top: 10px;
  background: var(--piros);
  color: #fff;
  border-radius: 13px;
  padding: 13px 10px;
  text-align: center;
}
.mini-piros b {
  font-family: "Archivo", sans-serif;
  font-size: 1.03rem;
  letter-spacing: -0.01em;
}
.mini-piros span { display: block; font-size: 0.76rem; margin-top: 3px; opacity: 0.93; }

/* ── A hivatalos segélyhívó tábla ───────────────────────────────── */

.tabla {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-top: 10px;
}
.tabla.onallo { max-width: 460px; gap: 10px; margin-top: 0; }

.szam-lap {
  border-radius: 10px;
  padding: 9px 4px 8px;
  text-align: center;
  border: 2px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.szam-lap svg { width: 19px; height: 19px; }
.szam-lap .nev {
  font-family: "Archivo", sans-serif;
  font-weight: 700;
  font-size: 0.63rem;
  letter-spacing: 0.02em;
  line-height: 1.1;
}
.szam-lap .szam {
  font-family: "Archivo", sans-serif;
  font-weight: 700;
  font-size: 0.98rem;
  font-variant-numeric: tabular-nums;
}
.tabla.onallo .szam-lap { padding: 15px 8px 13px; }
.tabla.onallo .szam-lap svg { width: 27px; height: 27px; }
.tabla.onallo .szam-lap .nev { font-size: 0.76rem; }
.tabla.onallo .szam-lap .szam { font-size: 1.32rem; }

.lap-piros { background: #C62828; color: #fff; }
.lap-feher-piros { background: #fff; color: #C62828; border-color: #C62828; }
.lap-feher-kek { background: #fff; color: #12539E; border-color: #12539E; }
.lap-kek { background: #12539E; color: #fff; }


/* ── Két üzemmód ────────────────────────────────────────────────── */

.mod-racs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}

.mod {
  background: var(--lap);
  border: 1px solid var(--vonal-eros);
  border-radius: var(--sugar);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.mod .fej { display: flex; align-items: center; gap: 11px; }
.mod .fej svg { width: 26px; height: 26px; flex: none; color: var(--kek); }
.mod p { color: var(--halvany); font-size: 0.955rem; }

.kinek-racs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
  gap: 14px;
}
.kinek {
  border-left: 3px solid var(--piros);
  padding: 3px 0 3px 15px;
  display: flex;
  flex-direction: column;
  gap: 5px;

.kinek b { font-weight: 600; }

/* ── A beállító képernyő ábrája ─────────────────────────────────── */

.beall-racs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(305px, 1fr));
  gap: 20px;
  align-items: start;
}

.makett {
  background: var(--lap);
  border: 1px solid var(--vonal-eros);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.makett-cim {
  font-family: "Archivo", sans-serif;
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--halvany);
}

.makett-fej { display: flex; gap: 14px; align-items: flex-start; }

.makett-kep {
  width: 84px; height: 84px;
  border-radius: 11px;
  overflow: hidden;
  flex: none;
  background: color-mix(in srgb, var(--tinta) 7%, transparent);
  display: grid; place-items: center;
}
.makett-kep svg { width: 100%; height: 100%; }

.mezok { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 11px; }

.mezo { display: flex; flex-direction: column; gap: 2px; }
.mezo .cimke-kis {
  font-size: 0.76rem;
  color: var(--halvany);
}
.mezo .ertek {
  font-size: 1rem;
  padding-bottom: 4px;
  border-bottom: 1.5px solid var(--vonal-eros);
  font-variant-numeric: tabular-nums;
}

.kerdes { font-size: 0.93rem; font-weight: 600; }

.valaszto { display: flex; gap: 9px; flex-wrap: wrap; }
.valaszto div {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--vonal-eros);
  font-size: 0.93rem;
  color: var(--halvany);
}
.valaszto div svg { width: 17px; height: 17px; }
/* A kiválasztott: NEM csak szín — vastagabb keret és félkövér is. */
.valaszto div.aktiv {
  border-color: var(--kek);
  border-width: 2.5px;
  color: var(--tinta);
  font-weight: 600;
}

.jegyzet-dolt {
  font-size: 0.875rem;
  font-style: italic;
  color: var(--halvany);
}

.jelolo { display: flex; gap: 11px; align-items: flex-start; font-size: 0.93rem; }
.jelolo .pipa {
  width: 21px; height: 21px;
  border-radius: 5px;
  background: var(--kek);
  display: grid; place-items: center;
  flex: none;
  margin-top: 1px;
}
.jelolo .pipa svg { width: 13px; height: 13px; }

.uzenet-doboz {
  background: color-mix(in srgb, var(--zold) 10%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--zold) 45%, transparent);
  border-radius: 10px;
  padding: 11px 13px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.uzenet-doboz .cimke-kis { font-size: 0.76rem; color: var(--halvany); }
.uzenet-doboz .ertek { font-size: 0.97rem; }


/* ── A film ─────────────────────────────────────────────────────── */

.film-doboz {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* ⚠ A film ÁLLÓ (9:16). Szélességben korlátozzuk, különben asztali
   gépen az egész képernyőt elfoglalná, és nevetségesen nézne ki. */
.film-doboz video {
  width: 100%;
  max-width: 330px;
  aspect-ratio: 9 / 16;
  border-radius: 20px;
  border: 1px solid var(--vonal-eros);
  background: #0B0D12;
  display: block;
}

.film-jegyzet {
  font-size: 0.9rem;
  color: var(--halvany);
  text-align: center;
  max-width: 42ch;
}

/* ── Tartalmi elemek ────────────────────────────────────────────── */

.racs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
  gap: 18px;
}

.kartya {
  background: var(--lap);
  border: 1px solid var(--vonal);
  border-radius: var(--sugar);
  padding: 20px 21px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.kartya p { color: var(--halvany); font-size: 0.955rem; }

.elv {
  background: var(--lap);
  border: 1px solid var(--vonal-eros);
  border-radius: var(--sugar);
  padding: clamp(24px, 4vw, 38px);
}
.elv-mondat {
  font-family: "Archivo", sans-serif;
  font-weight: 700;
  font-size: clamp(1.35rem, 3.6vw, 1.85rem);
  letter-spacing: -0.022em;
  line-height: 1.2;
}
.elv-mondat em { font-style: normal; color: var(--piros); }

/* Lépések — ez tényleg SORREND, ezért van megszámozva */
ol.lepesek { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; counter-reset: l; }
ol.lepesek li {
  counter-increment: l;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 15px;
  align-items: start;
}
ol.lepesek li::before {
  content: counter(l);
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--kek);
  color: var(--lap);
  display: grid; place-items: center;
  font-family: "Archivo", sans-serif;
  font-weight: 700;
  font-size: 0.94rem;
}
ol.lepesek li b { display: block; font-weight: 600; }
ol.lepesek li span { color: var(--halvany); font-size: 0.955rem; }

/* Zárak és korlátok — a jelentést IKON + SZÖVEG hordozza, nem a szín */
ul.tetelek { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
ul.tetelek li { display: grid; grid-template-columns: 26px 1fr; gap: 13px; align-items: start; }
ul.tetelek li svg { width: 21px; height: 21px; margin-top: 3px; }
/* ⚠ A cím SAJÁT SORBA kell: enélkül a magyarázat hozzáragad
   („…akkumulátorAz üzenet közönséges SMS”). A lépéseknél beállítottam,
   itt elfelejtettem — a böngészőben látszott meg. */
ul.tetelek li b { display: block; font-weight: 600; }
ul.tetelek li span { color: var(--halvany); }

.doboz-sarga {
  background: var(--sarga-lap);
  border: 1px solid color-mix(in srgb, #C9922A 45%, var(--vonal));
  border-radius: var(--sugar);
  padding: 18px 20px;
  font-size: 0.965rem;
}

.zaras {
  background: var(--lap);
  border: 1px solid var(--vonal-eros);
  border-radius: var(--sugar);
  padding: clamp(24px, 4vw, 36px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: flex-start;
}

.kapcsolat {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: var(--tinta);
  color: var(--papir);
  text-decoration: none;
  font-family: "Archivo", sans-serif;
  font-weight: 600;
  font-size: 1rem;
  padding: 13px 21px;
  border-radius: 11px;
}
.kapcsolat:hover { opacity: 0.88; }
.kapcsolat svg { width: 18px; height: 18px; }

.bolt-jegyzet {
  font-size: 0.9rem;
  color: var(--halvany);
  border: 1px dashed var(--vonal-eros);
  border-radius: 11px;
  padding: 13px 16px;
}

footer {
  border-top: 1px solid var(--vonal);
  padding: 30px 0 44px;
  font-size: 0.885rem;
  color: var(--halvany);
}
footer .sor { display: flex; gap: 10px 26px; flex-wrap: wrap; align-items: baseline; }
/* Az adatvédelmi tájékoztató linkje: ne csak SZÍNNEL váljon el —

   egyetlen jelzés). */
footer a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
footer a:hover, footer a:focus-visible { color: var(--kek); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

      ['Csak Androidra', 'iPhone-ra nem készül. Az iOS szándékosan nem enged automatikus SMS-küldést — ott a beépített Vész-SOS a jó megoldás, és az jobb, mint amit mi tudnánk.'],

    hos_cimke: 'Kostenlose Notruf-App für Android',
    hos_cim: 'Im Notfall soll man nichts entscheiden müssen.',
    hos_bev: 'Segítség ist eine Notruf-App mit sehr großen Tasten. Ich habe sie für meine 83-jährige Mutter gebaut, die sich verlaufen hatte und nicht sagen konnte, wo sie war. Seitdem bekommt sie jeder — kostenlos.',
    gomb_fo: 'ICH BRAUCHE HILFE!',
    gomb_alatt: 'Ein Tippen. Das Telefon ermittelt den Standort und schickt eine SMS an die Familie.',
    hos_alairas: 'Ich bin Péter Kürtösi — Maschinenbau-, Software- und Elektroingenieur. Ich habe das für mich und meine Mutter gebaut. Kein Geschäft — und es wird auch keines.',
    makett_kinek: 'Benachrichtigt: Klotild, Peter',

    film_cimke: 'Ansehen',
    film_cim: 'Dreißig Sekunden, und Sie verstehen es.',
    film_bev: 'So sieht es aus, wenn jemand die rote Taste drückt — und wie die Familie den Weg dorthin findet.',
    film_jegyzet: '⚠️ Das Video ist auf Ungarisch — die Bilder sprechen aber für sich. Es hat keinen Ton. Die gezeigten Namen und der Ort sind erfunden.',
    miert_cimke: 'Warum es das gibt',
    miert_cim: 'Sie hatte ihr Telefon dabei. Sie hat angerufen. Und wir konnten trotzdem nicht helfen.',
    miert_1: 'Im Mai 2026 hat sich meine Mutter verlaufen. Sie war nicht hilflos: Sie hatte ihr Telefon dabei und hat uns angerufen. Aber sie konnte nicht sagen, wo sie war — und wir konnten es nicht nachsehen.',
    miert_2: 'Das Problem war nicht das fehlende Smartphone. Das Problem war, dass das Telefon genau in dem Moment, in dem es helfen sollte, eine Frage stellte: welche App, welche Taste, welches Menü.',
    miert_3: 'Danach habe ich monatelang daran gearbeitet: was sie sehen soll, was sie nicht entscheiden muss, wie sie sich darin nicht verirren kann. Drei Monate später war sie das, was sie heute ist — und wenige Tage danach lief sie auch auf fremden Telefonen.',

    elv_cimke: 'Das Leitprinzip',
    elv_mondat: 'Nicht idiotensicher. <em>Großmutter-sicher.</em>',
    elv_szoveg: 'Ein Techniker versteht das Gerät, er hat es nur eilig. Sie versteht es nicht — und sie hat Angst. Deshalb stellt Segítség niemandem eine Frage, der in Not ist. Alle Entscheidungen — Berechtigungen, Einstellungen, Zugriffe — werden vorher erledigt: dann, wenn die helfende Person noch daneben steht.',

    mit_cimke: 'Was sie tut',
    mit_cim: 'Sechs Fotos, eine rote Taste und die Notrufnummern.',
    k1_cim: 'Das Foto ist die Taste',
    k1_szo: 'Sechs große Kacheln. Wer den Namen nicht lesen kann, erkennt das Gesicht. Ohne Foto gibt es ein gezeichnetes Gesicht — keine graue Silhouette.',
    k2_cim: 'Anrufen — oder schreiben',
    k2_szo: 'Pro Kachel einstellbar: anrufen oder eine vorgeschriebene Nachricht senden. „Hier ist Opa, bitte schau mal nach mir." Den Text schreiben Sie selbst.',
    k3_cim: 'Die rote Taste sagt, wo sie ist',
    k3_szo: 'Sie ermittelt den Standort und schickt eine SMS an die ausgewählten Personen — mit der genauen Position. Keine Rückfrage, keine Bestätigung.',
    k4_cim: 'Großmutter-Modus',
    k4_szo: 'Eingeschaltet wird die App zum Startbildschirm: man kann sie nicht versehentlich schließen und sich im Telefon nicht verirren. Ausgeschaltet ist sie eine ganz normale App.',

    tabla_cimke: 'Die Notrufleiste',
    tabla_cim: 'Die offiziellen Nummern, nicht unsere Idee.',
    tabla_szo: 'Farbe, Symbol und Reihenfolge stammen von der offiziellen Notruftafel. In einer Notlage zählt Gewohnheit mehr als Logik: Wer diese Reihenfolge tausendmal gesehen hat, soll sie von uns nicht umgestellt bekommen.',
    tabla_figyelem: '⚠️ Diese Tasten sind frei änderbar. In der App sind derzeit die ungarischen Nummern voreingestellt — in anderen Ländern müssen sie in den Einstellungen angepasst werden. Eine deutsche Sprachversion der App ist in Arbeit.',

    beall_cimke: 'Die Einrichtung',
    beall_cim: 'Dieser Teil ist für Sie, nicht für sie.',
    beall_bev: 'Segítség wird nicht von der Person eingerichtet, die sie benutzt. Das machen die Kinder, die Enkel, die Nachbarin — einmal, und danach nie wieder.',
    l1_cim: 'Kacheln füllen',
    l1_szo: 'Foto aus der Galerie (das Gesicht lässt sich zuschneiden) oder ein gezeichnetes Gesicht, dazu Name und Telefonnummer.',
    l2_cim: 'Festlegen, wer den Notruf bekommt',
    l2_szo: 'Die rote Taste erreicht nur die Ausgewählten. Auf dem Startbildschirm steht, wer benachrichtigt wird.',
    l3_cim: 'Berechtigungen jetzt erteilen',
    l3_szo: 'Standort und SMS. Die App führt Schritt für Schritt hindurch und bestätigt grün, wenn es geklappt hat. Das ist der wichtigste Schritt: im Notfall ist dafür keine Zeit.',
    l4_cim: 'Großmutter-Modus einschalten, falls nötig',
    l4_szo: 'Ein Schalter. Danach kann das Telefon eine einzige Sache — und die kann man nicht falsch machen.',
    beall_zaro: 'Das Ganze dauert fünf Minuten. Eine ausführliche Hilfe ist eingebaut.',

    mod_cimke: 'Zwei Betriebsarten',
    mod_cim: 'Nicht nur für Großeltern.',
    mod_bev: 'Ein Schalter entscheidet, wie weit die App das Telefon übernimmt. Dieselbe App, zwei völlig verschiedene Verhaltensweisen.',
    mod1_cim: 'Großmutter-Modus',
    mod1_szo: 'Die App wird zum Startbildschirm. Auch nach ZURÜCK, HOME oder dem App-Wechsler landet das Telefon wieder hier — man kann sie nicht versehentlich schließen und sich in den Menüs nicht verirren. Wer das braucht, hat ein Telefon, das eine einzige Sache kann — und die kann man nicht falsch machen.',
    mod2_cim: 'Normale App',
    mod2_szo: 'Ausgeschaltet ist sie eine ganz gewöhnliche App: öffnen, benutzen, schließen. Alle anderen Funktionen des Telefons bleiben unangetastet. So eignet sie sich auch für Menschen, die mit ihrem Telefon gut zurechtkommen.',
    kinek_cim: 'Für wen der normale Modus außerdem gut ist',
    kinek: [
      ['Wer nicht sprechen kann', 'Jemand aus meiner Familie kann nicht sprechen. Das Auto blieb auf einer leeren Landstraße liegen. Anrufen hätte diese Person jeden können — sprechen nicht. Und per SMS zu erklären, wo sie stand, hätte mehrere Sätze gebraucht. Ein Tippen hätte gereicht. Vielen geht es so: nach einem Schlaganfall, mit einer Sprachstörung — oder einfach, weil in Panik kein Ton herauskommt.'],
      ['Für Schulkinder', 'Sie können mit dem Telefon umgehen — verlaufen können sie sich trotzdem. Ein Tippen, und die Eltern wissen, wo sie sind. Sie müssen nicht überlegen, wen sie anrufen, und nicht erklären, wo sie gerade stehen.'],
      ['Beim Autofahren', 'Ein großes Foto, ein Tippen, Anruf. Kein Suchen im Adressbuch, während man auf die Straße schaut.'],
      ['Für Alleinlebende', 'Die rote Taste hilft auch, wenn jemand zu Hause stürzt oder ihm schlecht wird — man muss nicht überlegen, wem man was schreibt.']

    beall2_bev: 'Es lohnt sich, das vor dem Herunterladen anzusehen: daran erkennen Sie, ob die App das kann, was Sie erwarten. So sieht die Einstellung einer Kachel aus.',
    mak_cim1: 'Kachel · Anruf-Modus',

    mak_jelolo: 'Soll auch von der Taste ICH BRAUCHE HILFE benachrichtigt werden (mit Standort)',

    beall2_meg: 'Was sich außerdem einstellen lässt',
    beall2_lista: [

      ['Foto oder gezeichnetes Gesicht', 'Aus einem Foto aus der Galerie lässt sich das Gesicht zuschneiden: ziehen und mit KLEINER / GRÖSSER heranzoomen. Ohne Foto können Sie ein gezeichnetes weibliches oder männliches Gesicht wählen — auch das ist erkennbar, keine graue Silhouette.'],
      ['Wer den Notruf bekommt', 'Pro Kachel einzeln. Auf dem Startbildschirm stehen die Namen unter der roten Taste, damit man sie sich nicht merken muss.'],
      ['Zugang zu den Einstellungen', 'Langes Drücken auf das Zahnrad, dann eine Rückfrage — bei der NEIN die große grüne Taste ist. So gerät niemand versehentlich hinein.'],

    nem_cimke: 'Was sie nicht tut',

    nem_bev: 'Kein Server, kein Konto, keine Registrierung, keine Werbung. Das ist kein Versprechen, sondern zwei Schlösser:',

    zar2_cim: 'Die automatische Cloud-Sicherung ist abgeschaltet',

    nem_zaro: 'Der Preis dafür: Auf ein neues Telefon werden die Einstellungen nicht übernommen. Fünf Minuten neu einrichten — dafür liegt die Notfallliste Ihrer Großmutter nirgends in einer Cloud.',

    korlat_cimke: 'Ehrliche Grenzen',

      ['Keine Notrufzentrale', 'Sie benachrichtigt die Familie, nicht den Rettungsdienst. Der Notruf lässt sich mit einem Tippen wählen, aber die rote Taste gilt der Familie.'],

  en: {
    nevek: ['Klotild', 'Peter', 'Kati', 'Marika', 'Dr. House'],

    szamok: [
      { o: 'lap-piros',       i: 'mento',   n: 'AMBULANCE', s: '999' },

    ],

    hos_cimke: 'A free emergency-call app for Android',
    hos_cim: 'In an emergency, nobody should have to decide anything.',
    hos_bev: 'Segítség is an emergency-call app with very large buttons. I built it for my 83-year-old mother, who got lost and could not say where she was. Since then anyone can have it, free.',
    gomb_fo: "I'M IN TROUBLE!",
    gomb_alatt: 'One tap. The phone finds where you are and texts your family.',
    hos_alairas: "I'm Péter Kürtösi — a mechanical, software and electrical engineer. I built this for myself and my mother. It isn't a business, and it won't become one.",
    makett_kinek: 'Alerts: Klotild, Peter',

    film_cimke: 'Watch',
    film_cim: 'Thirty seconds, and you have it.',
    film_bev: 'This is what happens when someone presses the red button — and how the family finds their way there.',
    film_jegyzet: '⚠️ The film is in Hungarian — but the pictures speak for themselves. There is no sound. The names and the location shown are fictional.',
    miert_cimke: 'Why it exists',
    miert_cim: 'She had her phone. She called us. And we still could not help.',
    miert_1: 'In May 2026 my mother got lost. She was not helpless: she had her phone with her, and she called us. But she could not tell us where she was — and we had no way to look.',
    miert_2: 'The problem was not that she lacked a smartphone. The problem was that at the exact moment it should have helped, the phone asked her a question: which app, which button, which menu.',
    miert_3: 'Then I worked on it for months: what she should see, what she should never have to decide, how she could not get lost inside it. Three months later it was what it is now — and within days it was working on strangers’ phones too.',

    elv_cimke: 'The guiding principle',
    elv_mondat: 'Not foolproof. <em>Grandmother-proof.</em>',
    elv_szoveg: 'A technician understands the machine — they are just in a hurry. She does not understand it, and she is frightened. So Segítség never asks a question of someone who is in trouble. Every decision — permissions, settings, access — is settled in advance, while the person helping is still standing next to her.',

    mit_cimke: 'What it does',
    mit_cim: 'Six photos, one red button, and the emergency numbers.',
    k1_cim: 'The photo is the button',
    k1_szo: 'Six large tiles. Someone who cannot read the name will recognise the face. With no photo, you get a drawn face — not a grey silhouette.',
    k2_cim: 'Tap to call — or to text',
    k2_szo: 'Set per tile: call the person, or send a message you wrote in advance. "It’s Grandad, please look in on me." You write the words.',
    k3_cim: 'The red button says where they are',
    k3_szo: 'It finds the location and texts the people you chose — with the exact position. No question, no confirmation step.',
    k4_cim: 'Grandmother mode',
    k4_szo: 'Turned on, the app becomes the home screen: it cannot be closed by accident, and nobody gets lost inside the phone. Turned off, it is an ordinary app.',

    tabla_cimke: 'The emergency row',
    tabla_cim: 'The official numbers, not our invention.',
    tabla_szo: 'The colour, the symbol and the order come from the official emergency signage. In a crisis, habit beats logic: if someone has seen that order a thousand times, we should not be the ones to rearrange it.',
    tabla_figyelem: '⚠️ These buttons are fully editable. The app currently ships with the Hungarian numbers — in other countries they must be changed in the settings. An English version of the app is in progress.',

    beall_cimke: 'Setting it up',
    beall_cim: 'This part is for you, not for them.',
    beall_bev: 'Segítség is not set up by the person who will use it. A son, a granddaughter, a neighbour sets it up — once, and then it never needs touching again.',
    l1_cim: 'Fill the tiles',
    l1_szo: 'A photo from the gallery (you can crop to the face) or a drawn face, plus a name and a phone number.',
    l2_cim: 'Choose who gets the alert',
    l2_szo: 'The red button only reaches the people you mark. The home screen shows who will be notified.',
    l3_cim: 'Grant the permissions now',
    l3_szo: 'Location and messaging. The app walks you through it and confirms in green when it worked. This is the step that matters most: in an emergency there is no time for it.',
    l4_cim: 'Turn on grandmother mode, if needed',
    l4_szo: 'One switch. After that the phone does exactly one thing, and it cannot be got wrong.',
    beall_zaro: 'The whole thing takes five minutes. There is a detailed built-in help section.',

    mod_cimke: 'Two modes',
    mod_cim: 'Not only for grandparents.',
    mod_bev: 'One switch decides how far the app takes over the phone. The same app, two completely different behaviours.',
    mod1_cim: 'Grandmother mode',
    mod1_szo: 'The app becomes the home screen. BACK, HOME and the app switcher all bring the phone back here — it cannot be closed by accident, and nobody gets lost in the menus. For someone who needs that, the phone does exactly one thing, and it cannot be got wrong.',
    mod2_cim: 'Ordinary app',
    mod2_szo: 'Switched off it is a perfectly ordinary app: open it, use it, close it. Every other function of the phone is untouched. That makes it useful for people who are perfectly comfortable with their phone.',
    kinek_cim: 'Who else the ordinary mode suits',
    kinek: [
      ['People who cannot speak', 'A relative of mine cannot speak. Their car broke down on an empty road. They could have dialled anyone — but not said a word. And explaining by text where they were standing would have taken several sentences. One tap would have solved it. Many people are in the same position: after a stroke, with a speech impairment — or simply because in a panic no sound comes out.'],
      ['School-age children', 'They can work a phone — but they can still get lost. One tap, and a parent knows where they are. No working out who to call, and no having to describe where they are standing.'],
      ['While driving', 'One large photo, one tap, a call. No hunting through contacts while watching the road.'],
      ['People living alone', 'The red button helps just as much if someone falls or feels unwell at home — no deciding who to message, or what to say.']
    ],

    beall2_cimke: 'What you can set up',
    beall2_cim: 'Every tile is configured separately.',
    beall2_bev: 'Worth looking at before you download it: this is what tells you whether the app does what you are hoping for. Here is how one tile is set up.',
    mak_cim1: 'Tile · call mode',
    mak_cim2: 'Tile · message mode',
    mak_nev_cimke: 'Name',
    mak_nev1: 'Klotild',
    mak_nev2: 'Kati',
    mak_szam_cimke: 'Phone number',
    mak_szam1: '+44 7700 900123',
    mak_szam2: '+44 7700 900456',
    mak_kerdes: 'When this picture is tapped:',
    mak_hiv: 'call them',
    mak_uzen: 'message them',
    mak_fuggetlen: 'These two are independent: a tile can send a message on tap AND receive the emergency alert.',
    mak_jelolo: 'Also alert this person from the I’M IN TROUBLE button (with the location)',
    mak_uzenet_cimke: 'The message that goes out',
    mak_uzenet: 'It’s Grandad, please look in on me!',
    mak_uzenet_jegyzet: 'You write the words. Left blank, a general message goes out instead — never an empty text.',
    beall2_meg: 'What else you can set',
    beall2_lista: [
      ['The emergency buttons', 'The name and number of all four can be changed — different country, different numbers. Numbers you have already changed are never overwritten by an update.'],
      ['Photo or drawn face', 'From a gallery photo you can crop to the face: drag it, and zoom in with SMALLER / LARGER. With no photo you can pick a drawn female or male face — recognisable too, not a grey silhouette.'],
      ['Who receives the alert', 'Set per tile. On the home screen their names appear under the red button, so nobody has to remember.'],
      ['Getting into the settings', 'A long press on the gear, then a question — where NO is the big green button. So nobody wanders in by accident.'],
      ['Built-in help', 'A detailed description of every setting and the common questions, inside the app itself.']
    ],

    nem_cimke: 'What it does not do',
    nem_cim: 'We know nothing about you. We do not want to.',
    nem_bev: 'No server, no account, no sign-up, no adverts. That is not a promise — it is two locks:',
    zar1_cim: 'The app has no internet permission',
    zar1_szo: 'The operating system would not let it send data anywhere. Anyone can check this in the phone’s settings.',
    zar2_cim: 'The system’s cloud backup is switched off for it',
    zar2_szo: 'This one matters: by default Android uploads app data to Google Drive — not the app, the system itself. We found this by measurement, and switched it off.',
    nem_zaro: 'The price: settings do not move to a new phone by themselves. Five minutes to set it up again — in exchange, your grandmother’s emergency list is not sitting in anyone’s cloud.',

    korlat_cimke: 'Honest limits',
    korlat_cim: 'What to know before you let someone rely on it.',
    korlat_bev: 'This is a phone app, not a miracle. What it cannot do:',
    korlatok: [

/* ═══ Megjelenítés ═════════════════════════════════════════════════ */

const MERETEK = ['15px', '17px', '19.5px'];

function biztosTarolas(muvelet, alap) {
  try { return muvelet(); } catch (e) { return alap; }
}

function csempetRajzol(sz) {
  const cs = document.getElementById('csempek');
  let html = '';
  for (let i = 0; i < 6; i++) {
    if (i < 5) {
      html += '<div class="csempe">' + ARCOK[i] +
              '<span class="csempe-nev">' + sz.nevek[i] + '</span></div>';
    } else {
      html += '<div class="csempe ures"><svg viewBox="0 0 24 24" fill="none" stroke="#8B93A1" stroke-width="1.7" stroke-linecap="round">' +
              '<circle cx="10" cy="8.5" r="3.6"/><path d="M3.6 19.5c0-3.4 2.9-5.6 6.4-5.6 1.1 0 2.1.2 3 .6M17.5 14.4v5.4M14.8 17.1h5.4"/></svg>' +
              '<span class="csempe-nev">' + sz.ures + '</span></div>';
    }
  }
  cs.innerHTML = html;
}

function tablatRajzol(sz) {
  const html = sz.szamok.map(function (t) {
    return '<div class="szam-lap ' + t.o + '">' + IKON[t.i] +
           '<span class="nev">' + t.n + '</span>' +
           '<span class="szam">' + t.s + '</span></div>';
  }).join('');
  document.getElementById('tabla-mini').innerHTML = html;
  document.getElementById('tabla-nagy').innerHTML = html;
}

function korlatokatRajzol(sz) {
  document.getElementById('korlatok').innerHTML = sz.korlatok.map(function (k) {
    return '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
           '<path d="M12 3.6 22 20.4H2z"/><path d="M12 9.6v4.2M12 17.2h.01"/></svg>' +
           '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div></li>';
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════════
   A KIADÁS ADATAI — élőben, a GitHubtól

   ⭐ Egy lekérdezés két dolgot old meg: a letöltésszámot ÉS a
     verziószámot. Így a lábléc verziója soha nem avul el.

   ⚠ Ha a lekérdezés bármiért nem sikerül (nincs hálózat, nincs még
     kiadás, vagy a lap nem a GitHubról fut), akkor CSENDBEN marad a
     statikus szöveg. Hibaüzenetet nem mutatunk: a látogatót nem
     érdekli, és nem is tud vele mit kezdeni.
   ═══════════════════════════════════════════════════════════════════ */

const KIADAS_API =
  'https://api.github.com/repos/peterkurtosi/segitseg/releases/latest';

let kiadasAdat = null;   // { verzio, letoltes }

function kiadastKiir() {
  if (!kiadasAdat) return;
  const sz = SZOVEG[document.documentElement.lang] || SZOVEG.hu;

  const v = document.getElementById('lab-verzio');
  if (v) v.textContent = sz.lab_verzio_elo + kiadasAdat.verzio;

  const l = document.getElementById('letoltesek');
  if (l && kiadasAdat.letoltes > 0) {
    l.textContent = kiadasAdat.letoltes.toLocaleString() + sz.lab_letoltes;
    l.hidden = false;
  }
}

function kiadastLekerdez() {
  fetch(KIADAS_API)
    .then(function (v) { return v.ok ? v.json() : null; })
    .then(function (a) {
      if (!a || !a.tag_name) return;
      const db = (a.assets || []).reduce(function (osszeg, e) {
        return osszeg + (e.download_count || 0);
      }, 0);
      kiadasAdat = {
        verzio: String(a.tag_name).replace(/^v/, ''),
        letoltes: db
      };
      kiadastKiir();
    })
    .catch(function () { /* marad a statikus szöveg */ });
}

function ujSzakaszokatRajzol(sz) {
  // A makett arcképei — ugyanaz a rajz, mint a csempéken.
  document.getElementById('mak-arc1').innerHTML = ARCOK[0];
  document.getElementById('mak-arc2').innerHTML = ARCOK[2];

  document.getElementById('kinek-racs').innerHTML = sz.kinek.map(function (k) {
    return '<div class="kinek"><b>' + k[0] + '</b><span>' + k[1] + '</span></div>';
  }).join('');

  document.getElementById('beall2-lista').innerHTML = sz.beall2_lista.map(function (k) {
    return '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
           'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
           '<path d="M4.6 12.4l5 5 9.8-10.4"/></svg>' +
           '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div></li>';
  }).join('');
}

function nyelvetAllit(kod) {
  const sz = SZOVEG[kod];
  if (!sz) return;

  document.documentElement.lang = kod;

  document.querySelectorAll('[data-t]').forEach(function (el) {
    const ertek = sz[el.dataset.t];
    if (typeof ertek === 'string') el.innerHTML = ertek;
  });

  csempetRajzol(sz);
  tablatRajzol(sz);
  korlatokatRajzol(sz);
  ujSzakaszokatRajzol(sz);
  kiadastKiir();

  document.querySelectorAll('.nyelvek button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.nyelv === kod));
  });

  biztosTarolas(function () { return localStorage.setItem('segitseg-nyelv', kod); });
}

function meretetAllit(index) {
  document.documentElement.style.setProperty('--alap', MERETEK[index]);
  document.querySelectorAll('.meret button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(Number(b.dataset.meret) === index));
  });
  biztosTarolas(function () { return localStorage.setItem('segitseg-meret', String(index)); });
}

document.querySelectorAll('.nyelvek button').forEach(function (b) {
  b.addEventListener('click', function () { nyelvetAllit(b.dataset.nyelv); });
});
document.querySelectorAll('.meret button').forEach(function (b) {
  b.addEventListener('click', function () { meretetAllit(Number(b.dataset.meret)); });
});

/* ⭐ Induló nyelv: MAGYAR — függetlenül a böngésző nyelvétől.
   (Peter döntése: az oldal elsősorban magyaroknak szól; a német és az
   angol változat a fenti gombokkal érhető el.)
   Akit másik nyelvre váltott, annak azt megjegyezzük. */
const mentettNyelv = biztosTarolas(function () { return localStorage.getItem('segitseg-nyelv'); }, null);
nyelvetAllit(mentettNyelv || 'hu');

const mentettMeret = biztosTarolas(function () { return localStorage.getItem('segitseg-meret'); }, null);
meretetAllit(mentettMeret !== null ? Number(mentettMeret) : 1);

kiadastLekerdez();
</script>
